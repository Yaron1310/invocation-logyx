name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint:js
      - run: npm run build

  php:
    name: PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: cs2pr

      - name: Syntax check
        run: find inc invocation.php -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Install PHPCS tooling
        run: composer install --no-interaction --no-progress --working-dir=tools

      - name: PHP_CodeSniffer
        run: tools/vendor/bin/phpcs --report-full --report-checkstyle=./phpcs-report.xml

      - name: Annotate PHPCS results
        if: ${{ always() }}
        run: cs2pr ./phpcs-report.xml
